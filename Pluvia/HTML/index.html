<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUVIA - Monitoreo de Lluvia</title>
<link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>
<!-- LOGIN -->
<div class="contenedor" id="login">
    <h2>MONITOREO LLUVIA<br>"PLUVIA"</h2>
    <img src="../1.png" alt="Logo Pluvia" class="logo">
    <label>USUARIO</label>
    <input type="text" id="usuario">
    <label>CONTRASEÑA</label>
    <input type="password" id="clave">
    <button onclick="ingresar()">INGRESAR</button>
    <p id="mensaje"></p>
</div>

<!-- PANEL -->
<div class="contenedor ancho oculto" id="panel">
    <div class="encabezado">
        <h3>Registro de precipitación</h3>
        <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div class="columnas">
        <div class="izquierda">
            <label>Dirección de la zona</label>
            <input type="text" id="direccion" placeholder="Ej: Calle 5 # 38-20">

            <div class="fila">
                <div>
                    <label>Hora de inicio</label>
                    <input type="time" id="horaInicio">
                </div>
                <div>
                    <label>Hora de fin</label>
                    <input type="time" id="horaFin">
                </div>
            </div>

            <label>Precipitación (mm)</label>
            <input type="number" id="precipitacion" placeholder="0" min="0" step="0.1">

            <label>Usuario que registra</label>
            <input type="text" id="registrador" placeholder="Nombre">

            <div class="fila">
                <button onclick="calcularRegistrar()">Calcular y registrar</button>
                <button class="secundario" id="btnFoto" onclick="tomarFoto()">Tomar foto</button>
            </div>
        </div>

        <div class="derecha">
            <label>Resultado</label>
            <div id="resultado">Aquí aparecerá el resultado</div>

            <label>Foto de la zona</label>
            <div id="cajaFoto">
                <video id="video" autoplay playsinline class="oculto"></video>
                <img id="foto" class="oculto" alt="Foto de la zona">
                <span id="textoFoto">[ vista previa de cámara / foto ]</span>
            </div>
        </div>
    </div>

    <label>Gráfica de barras (un registro por barra)</label>
    <div class="cajaGrafica"><canvas id="grafica"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../JS/codigo.js"></script>
</body>
</html>
